services: 
  database: 
    container_name: gamer_challenge_db
    image: postgres:18 
    restart: unless-stopped 
    volumes:
      - gamer_challenge_volume:/var/lib/postgresql 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_LOCAL_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: gamer_challenge_api
    build:
      context: .
      dockerfile: Dockerfile-api
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public"
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - ${API_LOCAL_PORT}:${PORT}
      - 51212:51212
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default      
      - gamer_network 

volumes: 
  gamer_challenge_volume: 

networks:
  gamer_network:
    name: gamer_network 
