services:
  api:
    command: sh -c "pnpm run db:migrate:deploy && pnpm run dev"
    volumes:
      - ./:/app # Monte le code source local dans le conteneur (live reload)
      - /app/node_modules # Volume anonyme : isole les node_modules du conteneur de ceux de l'hôte
      - /app/generated # Volume anonyme : isole le client Prisma généré (évite que le bind mount l'écrase)
